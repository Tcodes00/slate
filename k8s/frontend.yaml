apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: slate
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: slate-frontend:latest  # replace with your real registry/tag before applying; NEXT_PUBLIC_API_URL is baked in at build time (see frontend/Dockerfile), not set here
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: slate
spec:
  selector: { app: frontend }
  ports:
    - { port: 3000, targetPort: 3000 }
