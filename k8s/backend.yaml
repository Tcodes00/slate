apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: slate
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: slate-backend:latest  # replace with your real registry/tag before applying
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: slate-config }
            - secretRef: { name: slate-secrets }
          # /metrics doubles as the readiness/liveness check — it's the
          # one route guaranteed to work with zero external dependencies
          # (no DB query, no Redis call; see backend/metrics.py), so it
          # can't produce a false "unhealthy" from Postgres being briefly
          # slow the way a DB-touching health check could.
          readinessProbe:
            httpGet: { path: /metrics, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /metrics, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: slate
spec:
  selector: { app: backend }
  ports:
    - { port: 8000, targetPort: 8000 }
---
# WebSockets need every worker subscribed to the same Redis channel (see
# backend/events.py) for cross-pod delivery to work — already true here
# since REDIS_URL is shared across all backend replicas via the
# ConfigMap, not a per-pod concern this HPA needs to know about.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: slate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
